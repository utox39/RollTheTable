name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Maven build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "22"
          cache: maven

      - name: Package WAR
        run: mvn -B package

      - name: Upload WAR
        uses: actions/upload-artifact@v4
        with:
          name: RollTheTable-war
          path: target/RollTheTable.war
          if-no-files-found: error
          retention-days: 15
